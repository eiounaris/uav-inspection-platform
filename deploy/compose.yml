name: ${INFRA_COMPOSE_PROJECT_NAME:-uav-inspection}

services:
  mysql:
    image: ${MYSQL_IMAGE:?MYSQL_IMAGE is required}
    environment:
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME is required}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -h 127.0.0.1 -u "$${MYSQL_USER}" -D "$${MYSQL_DATABASE}" -Nse "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      start_period: 40s
      retries: 30
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:?REDIS_IMAGE is required}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      TZ: UTC
    user: redis
    command: [sh, -ec, 'exec redis-server --appendonly yes --appendfsync everysec --requirepass "$${REDIS_PASSWORD}"']
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: ${RABBITMQ_IMAGE:?RABBITMQ_IMAGE is required}
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      TZ: UTC
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, check_running]
      interval: 5s
      timeout: 10s
      start_period: 15s
      retries: 30
    restart: unless-stopped

  s3:
    image: ${S3_IMAGE:?S3_IMAGE is required}
    command: [/garage, server, --single-node, --default-bucket]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET is required}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:3900"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - s3-meta:/var/lib/garage/meta
      - s3-data:/var/lib/garage/data
    healthcheck:
      test: [CMD, /garage, status]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 30
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  s3-meta:
  s3-data:
