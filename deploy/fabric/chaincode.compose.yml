# Merged with compose.yml only after chaincode.py creates runtime.env.
services:
  evidence-org1:
    image: ${FABRIC_CHAINCODE_IMAGE:-uav-inspection/evidence-chaincode:0.1.0}
    restart: unless-stopped
    environment:
      CHAINCODE_SERVER_ADDRESS: 0.0.0.0:9999
      CORE_CHAINCODE_ID_NAME: ${EVIDENCE_ORG1_PACKAGE_ID:?Run chaincode.py deploy first}
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9999"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 15s

  evidence-org2:
    image: ${FABRIC_CHAINCODE_IMAGE:-uav-inspection/evidence-chaincode:0.1.0}
    restart: unless-stopped
    environment:
      CHAINCODE_SERVER_ADDRESS: 0.0.0.0:9999
      CORE_CHAINCODE_ID_NAME: ${EVIDENCE_ORG2_PACKAGE_ID:?Run chaincode.py deploy first}
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9999"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 15s
