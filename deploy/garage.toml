# Single-node development storage; persist both metadata and object data.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1
metadata_fsync = true
data_fsync = true

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
# RPC secret is supplied through GARAGE_RPC_SECRET, never committed here.

[s3_api]
api_bind_addr = "[::]:3900"
s3_region = "garage"
root_domain = ".s3.garage.localhost"
advertise_path_style = true
