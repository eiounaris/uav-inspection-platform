spring:
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:uav_inspection}?sslMode=${DB_SSL_MODE:REQUIRED}&connectionTimeZone=%2B00:00&forceConnectionTimeZoneToSession=true&preserveInstants=true&characterEncoding=UTF-8
    username: ${DB_USERNAME:uav_app}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      transaction-isolation: TRANSACTION_READ_COMMITTED
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true
  sql:
    init:
      mode: never
mybatis:
  type-handlers-package: com.uav.inspection.common.persistence
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
    default-statement-timeout: 10
    local-cache-scope: STATEMENT
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
inspection:
  device:
    online-threshold-seconds: ${DEVICE_ONLINE_THRESHOLD_SECONDS:20}
    presence-cache-ttl-seconds: ${DEVICE_PRESENCE_CACHE_TTL_SECONDS:60}
    presence-key-prefix: ${DEVICE_PRESENCE_KEY_PREFIX:inspection:device:seen:}
  auth:
    jwt-secret: ${JWT_SECRET}

# Authentication responses contain access tokens; keep HTTP body/header diagnostics disabled.
logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO
